[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-pixel-compression"
version = "1.0.0"
description = "Measuring cost-reduction levers in black-box multimodal APIs (IEEE INDICON 2026)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mukil Skanda A", email = "mukil1336@gmail.com" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["archive"]
